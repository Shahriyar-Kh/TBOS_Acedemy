name: Phase10B Production Deploy

on:
  push:
    branches:
      - fix/production-live-e2e
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TEST_URL: https://techbuiltos.online
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Production build
        run: node ./node_modules/vite/bin/vite.js build

      - name: Prepare ephemeral Worker secrets
        shell: bash
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
          } > .env.phase10b-deploy

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.145.0"
          packageManager: bun
          command: deploy --config .output/server/wrangler.json --secrets-file .env.phase10b-deploy

      - name: Remove ephemeral secrets
        if: always()
        shell: bash
        run: rm -f .env.phase10b-deploy

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production Playwright suite
        run: node ./node_modules/@playwright/test/cli.js test

      - name: Run 69-route production audit
        run: bun scripts/audit-all-routes.ts
