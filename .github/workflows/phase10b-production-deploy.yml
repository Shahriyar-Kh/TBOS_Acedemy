name: Phase10B Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_production_verification:
        description: "Run controlled live forms plus authenticated owner/admin and CMS lifecycle verification"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TEST_URL: https://techbuiltos.online
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_META_PIXEL_ID: ${{ vars.VITE_META_PIXEL_ID || secrets.VITE_META_PIXEL_ID }}
      GOOGLE_SCRIPT_URL: ${{ secrets.GOOGLE_SCRIPT_URL }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      ADMISSIONS_NOTIFICATION_EMAIL: ${{ secrets.ADMISSIONS_NOTIFICATION_EMAIL }}
      TBOS_E2E_ALLOW_LIVE_FORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_production_verification && '1' || '0' }}
      TBOS_E2E_ADMIN_EMAIL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_production_verification && secrets.TBOS_E2E_ADMIN_EMAIL || '' }}
      TBOS_E2E_ADMIN_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.full_production_verification && secrets.TBOS_E2E_ADMIN_PASSWORD || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript
        run: node ./node_modules/typescript/bin/tsc --noEmit

      - name: Production build
        run: node ./node_modules/vite/bin/vite.js build

      - name: Prepare ephemeral Worker secrets
        shell: bash
        run: |
          umask 077
          {
            printf 'SUPABASE_URL=%s\n' "$SUPABASE_URL"
            printf 'SUPABASE_SECRET_KEY=%s\n' "$SUPABASE_SECRET_KEY"
            printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY"
          } > .env.phase10b-deploy

          if [ -n "$GOOGLE_SCRIPT_URL" ]; then
            printf 'GOOGLE_SCRIPT_URL=%s\n' "$GOOGLE_SCRIPT_URL" >> .env.phase10b-deploy
          fi

          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_APP_PASSWORD" ]; then
            [ -n "$SMTP_HOST" ] && printf 'SMTP_HOST=%s\n' "$SMTP_HOST" >> .env.phase10b-deploy
            [ -n "$SMTP_PORT" ] && printf 'SMTP_PORT=%s\n' "$SMTP_PORT" >> .env.phase10b-deploy
            [ -n "$SMTP_SECURE" ] && printf 'SMTP_SECURE=%s\n' "$SMTP_SECURE" >> .env.phase10b-deploy
            printf 'SMTP_USER=%s\n' "$SMTP_USER" >> .env.phase10b-deploy
            printf 'SMTP_APP_PASSWORD=%s\n' "$SMTP_APP_PASSWORD" >> .env.phase10b-deploy
            [ -n "$ADMISSIONS_NOTIFICATION_EMAIL" ] && printf 'ADMISSIONS_NOTIFICATION_EMAIL=%s\n' "$ADMISSIONS_NOTIFICATION_EMAIL" >> .env.phase10b-deploy
          fi

      - name: Deploy production Worker
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.145.0"
          packageManager: bun
          command: deploy --config .output/server/wrangler.json --secrets-file .env.phase10b-deploy

      - name: Remove ephemeral secrets
        if: always()
        shell: bash
        run: rm -f .env.phase10b-deploy

      - name: Meta Pixel configured
        if: ${{ env.VITE_META_PIXEL_ID != '' }}
        run: echo "Meta Pixel repository variable is configured."

      - name: Meta Pixel not configured
        if: ${{ env.VITE_META_PIXEL_ID == '' }}
        run: echo "Meta Pixel repository variable is not configured; tracking remains safely disabled."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production Playwright suite
        run: node ./node_modules/@playwright/test/cli.js test

      - name: Run 69-route production audit
        run: bun scripts/audit-all-routes.ts
