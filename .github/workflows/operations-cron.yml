name: Academy Automated Operations Schedules

on:
  schedule:
    # Phase 18 CRM reminders: every 10 minutes, 05:00-23:00 PKT
    - cron: "*/10 0-18 * * *"
    # Phase 17 recurring sessions: 01:15 PKT daily
    - cron: "15 20 * * *"
    # Phase 17 monthly dues: 01:30 PKT daily
    - cron: "30 20 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Operation to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - reminders
          - recurring-sessions
          - monthly-dues

jobs:
  run-scheduled-operations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Process CRM Reminders
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '*/10 0-18 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'reminders')) }}
        run: |
          echo "Running CRM reminders"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -X POST https://techbuiltos.online/api/admin/reminders/process \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
          echo

      - name: Generate Recurring Class Sessions
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '15 20 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'recurring-sessions')) }}
        run: |
          echo "Generating recurring class sessions"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -X POST https://techbuiltos.online/api/admin/automation/generate-recurring-sessions \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
          echo

      - name: Generate Monthly Invoices
        if: ${{ (github.event_name == 'schedule' && github.event.schedule == '30 20 * * *') || (github.event_name == 'workflow_dispatch' && (inputs.job == 'all' || inputs.job == 'monthly-dues')) }}
        run: |
          echo "Generating monthly invoices"
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 60 \
            -X POST https://techbuiltos.online/api/admin/automation/generate-monthly-dues \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json"
          echo
