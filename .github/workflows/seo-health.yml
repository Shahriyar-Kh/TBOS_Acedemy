name: TBOS Production SEO Health & Lighthouse Audit

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Mondays at 06:00 UTC.
    - cron: "0 6 * * 1"

jobs:
  seo-health-audit:
    name: SEO, structured data, links, and performance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate TypeScript
        run: npm run typecheck

      - name: Build production application
        run: npm run build

      - name: Start local production preview
        run: |
          node scripts/prepare-preview.cjs
          npx vite preview --host 127.0.0.1 --port 4173 > /tmp/tbos-preview.log 2>&1 &
          echo $! > /tmp/tbos-preview.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/tbos-preview.log
          exit 1

      - name: Run local deterministic SEO gates
        env:
          TEST_URL: http://127.0.0.1:4173
        run: |
          npm run seo:audit
          npm run seo:links
          npm run seo:metadata
          npm run seo:structured-data
          npm run seo:performance

      - name: Run Phase 15 acceptance suite
        env:
          TEST_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/phase15-complete-seo.spec.ts --reporter=list

      - name: Audit live production SEO
        if: github.event_name != 'pull_request'
        env:
          TEST_URL: https://techbuiltos.online
        run: |
          npm run seo:audit
          npm run seo:links
          npm run seo:metadata
          npm run seo:structured-data
          npm run seo:performance

      - name: Run real Lighthouse CI against production
        if: github.event_name != 'pull_request'
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://techbuiltos.online/
            https://techbuiltos.online/courses
            https://techbuiltos.online/courses/python
            https://techbuiltos.online/specializations/full-stack-developer
            https://techbuiltos.online/blog/python-learning-roadmap-beginners
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Write audit summary
        if: always()
        run: |
          mkdir -p audit-reports
          {
            echo "# TBOS Production SEO Health Report"
            echo
            echo "- Date: $(date -u --iso-8601=seconds)"
            echo "- Job status at report time: ${{ job.status }}"
            echo "- Indexable HTML routes expected: 89"
            echo "- Additional audited public endpoint: /sitemap.xml"
            echo "- Detailed results: inspect the workflow log and Lighthouse artifacts"
          } > audit-reports/seo-health-summary.md

      - name: Upload SEO audit summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tbos-seo-health-summary
          path: audit-reports/
          retention-days: 30
